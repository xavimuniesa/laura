<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Natura morta amb quinqué</title>
<meta name="description" content="Natura morta a l'oli amb rellotge en hora local, tic-tac i quinqué que s'encén en fer-se fosc.">
<style>
  :root{ --dim:1; --frameLit:1; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#171410}
  body{display:flex;align-items:center;justify-content:center;
       font-family:Georgia,"Times New Roman",serif;-webkit-tap-highlight-color:transparent}
  /* paret de gotelé */
  #wall{position:fixed;inset:0;
    background:
      radial-gradient(circle at 20% 30%,rgba(255,255,255,.35) 0 1px,transparent 2px) 0 0/7px 7px,
      radial-gradient(circle at 70% 60%,rgba(120,100,70,.10) 0 1px,transparent 2px) 0 0/9px 9px,
      radial-gradient(ellipse at 50% 35%,#f1eadf 0%,#e6dccb 60%,#d9cdb9 100%);
    filter:brightness(var(--dim));}
  #stage{position:relative}
  #wood{position:absolute;inset:0;border-radius:2px;
    background:
      repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 2px,rgba(0,0,0,.05) 2px 5px,transparent 5px 11px),
      linear-gradient(135deg,#6b3524,#4a2418 45%,#5a2c1d 70%,#3e1d13);
    box-shadow:0 1.2vmin 2.5vmin rgba(0,0,0,.35),0 .2vmin .5vmin rgba(0,0,0,.4),
               inset 0 0 0 1px rgba(255,210,180,.10);
    filter:brightness(var(--frameLit));}
  #wood::after{content:"";position:absolute;inset:var(--fw);
    box-shadow:0 0 0 calc(var(--fw)*.28) #3a1a10, inset 0 0 calc(var(--fw)*.5) rgba(0,0,0,.55)}
  canvas{position:absolute;display:block}
  #knob{position:absolute;border:0;border-radius:50%;background:transparent;cursor:pointer;
        outline:none;z-index:3}
  #knob::after{content:"";position:absolute;inset:18%;border-radius:50%;
        box-shadow:0 0 0 0 rgba(255,215,150,0);transition:box-shadow .4s}
  #knob:hover::after,#knob:focus-visible::after{box-shadow:0 0 0 3px rgba(255,225,170,.55),0 0 14px 4px rgba(255,200,120,.35)}
  #knob.pulse::after{animation:pulse .8s ease-out}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,220,160,.8)}100%{box-shadow:0 0 0 18px rgba(255,220,160,0)}}
  #snd{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));
       width:40px;height:40px;border-radius:50%;border:1px solid rgba(80,50,30,.35);
       background:rgba(245,238,226,.72);color:#4a2a1a;cursor:pointer;display:grid;place-items:center;
       backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:5;transition:opacity .6s,background .6s}
  #snd svg{width:20px;height:20px}
  #snd .on{display:none} #snd[aria-pressed="true"] .on{display:block} #snd[aria-pressed="true"] .off{display:none}
  #hint{position:fixed;right:max(62px,calc(env(safe-area-inset-right) + 62px));bottom:max(22px,calc(env(safe-area-inset-bottom) + 8px));
        font-size:13px;font-style:italic;color:#5b3a26;background:rgba(245,238,226,.75);
        padding:5px 10px;border-radius:14px;z-index:5;transition:opacity 1.2s;pointer-events:none}
  body.night #snd{background:rgba(40,32,26,.6);color:#e9d2b0;border-color:rgba(255,220,180,.2)}
  body.night #hint{background:rgba(40,32,26,.6);color:#e9d2b0}
</style>
</head>
<body>
<div id="wall"></div>
<div id="stage">
  <div id="wood"></div>
  <canvas id="c" width="1500" height="1800" aria-label="Natura morta a l'oli: quinqué, llibres, rellotge despertador, gerro blau i flors sobre una taula amb estovalles grogues"></canvas>
  <button id="knob" title="Roda del quinqué: encén / apaga" aria-label="Encén o apaga el quinqué"></button>
</div>
<button id="snd" aria-pressed="false" title="Tic-tac" aria-label="Activa o silencia el tic-tac">
  <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
  <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg>
</button>
<div id="hint">Toca per sentir el tic-tac</div>

const stage = document.getElementById('stage');

function layout(){
  const vw = window.innerWidth, vh = window.innerHeight;
  const fwGuess = Math.max(10, Math.min(vw, vh) * 0.028);
  const availW = vw * 0.94 - 2*fwGuess, availH = vh * 0.94 - 2*fwGuess;
  const s = Math.min(availW / W, availH / H);
  const cw = W*s, ch = H*s, fw = fwGuess;
  stage.style.width = (cw + 2*fw) + 'px';
  stage.style.height = (ch + 2*fw) + 'px';
  stage.style.setProperty('--fw', fw + 'px');
  Object.assign(cv.style, { left: fw+'px', top: fw+'px', width: cw+'px', height: ch+'px' });
  const kr = Math.max(22, KNOB.r*s*1.6);
  Object.assign(knobBtn.style, { left: (fw + KNOB.x*s - kr) + 'px', top: (fw + KNOB.y*s - kr) + 'px',
                                 width: 2*kr + 'px', height: 2*kr + 'px' });
}
window.addEventListener('resize', layout); layout();

/* ---------- posició del sol ---------- */
let LAT = 41.4969, LON = 2.1575;   // Ripollet per defecte
if (navigator.geolocation) {
  navigator.geolocation.getCurrentPosition(p => { LAT = p.coords.latitude; LON = p.coords.longitude; },
                                           () => {}, { timeout: 8000, maximumAge: 3600e3 });
}
function sunAltitude(date, lat, lon){
  const r = Math.PI/180;
  const d = date.getTime()/86400000 + 2440587.5 - 2451545.0;
  const g = (357.529 + 0.98560028*d) * r;
  const q = 280.459 + 0.98564736*d;
  const L = (q + 1.915*Math.sin(g) + 0.020*Math.sin(2*g)) * r;
  const e = (23.439 - 0.00000036*d) * r;
  const ra = Math.atan2(Math.cos(e)*Math.sin(L), Math.cos(L));
  const dec = Math.asin(Math.sin(e)*Math.sin(L));
  const gmst = (18.697374558 + 24.06570982441908*d) % 24;
  const H = ((gmst*15 + lon) * r) - ra;
  return Math.asin(Math.sin(lat*r)*Math.sin(dec) + Math.cos(lat*r)*Math.cos(dec)*Math.cos(H)) / r;
}
const smooth = (a,b,x)=>{ const t=Math.min(1,Math.max(0,(x-a)/(b-a))); return t*t*(3-2*t); };
function autoDarkness(){ return 1 - smooth(-8, 2, sunAltitude(new Date(), LAT, LON)); }

/* ---------- estat: dia / nit, quinqué ---------- */
let override = null;           // {night:bool, auto:bool}
let D = autoDarkness();        // foscor mostrada 0..1
let lamp = D > 0.3 ? 1 : 0;   // nivell del quinqué 0..1
let ember = 0;                 // brasa de la metxa quan s'apaga
function targetDarkness(){
  const a = autoDarkness(), autoNight = a > 0.5;
  if (override && override.auto !== autoNight) override = null;   // la natura torna a manar
  return override ? (override.night ? 1 : 0) : a;
}
knobBtn.addEventListener('click', e => {
  e.stopPropagation();
  const autoNight = autoDarkness() > 0.5;
  const nowNight = targetDarkness() > 0.5;
  override = { night: !nowNight, auto: autoNight };
  if (override.night === autoNight) override = null;
  knobBtn.classList.remove('pulse'); void knobBtn.offsetWidth; knobBtn.classList.add('pulse');
  enableSound(true);
});

/* ---------- so: tic-tac sintetitzat ---------- */
let actx = null, soundOn = false, userMuted = false, noiseBuf = null;
const sndBtn = document.getElementById('snd'), hint = document.getElementById('hint');
function enableSound(fromGesture){
  if (userMuted && fromGesture !== 'button') return;
  try {
    if (!actx) {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      noiseBuf = actx.createBuffer(1, Math.floor(actx.sampleRate*0.05), actx.sampleRate);
      const ch = noiseBuf.getChannelData(0);
      for (let i=0;i<ch.length;i++) ch[i] = (Math.random()*2-1) * Math.pow(1 - i/ch.length, 3);
    }
    if (actx.state === 'suspended') actx.resume();
    soundOn = true; sndBtn.setAttribute('aria-pressed','true'); hint.style.opacity = 0;
  } catch(err){}
}
function tick(tac){
  if (!soundOn || !actx || actx.state !== 'running') return;
  const t = actx.currentTime + 0.005;
  const src = actx.createBufferSource(); src.buffer = noiseBuf;
  const bp = actx.createBiquadFilter(); bp.type = 'bandpass';
  bp.frequency.value = tac ? 2700 : 3600; bp.Q.value = 6;
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.55, t + 0.0015);
  g.gain.exponentialRampToValueAtTime(0.0008, t + 0.045);
  src.connect(bp).connect(g).connect(actx.destination); src.start(t); src.stop(t + 0.06);
  // ressonància metàl·lica de la caixa del despertador
  const o = actx.createOscillator(), og = actx.createGain();
  o.type = 'triangle'; o.frequency.value = tac ? 1480 : 1760;
  og.gain.setValueAtTime(0.0001, t);
  og.gain.exponentialRampToValueAtTime(0.05, t + 0.002);
  og.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
  o.connect(og).connect(actx.destination); o.start(t); o.stop(t + 0.08);
}
sndBtn.addEventListener('click', e => {
  e.stopPropagation();
  if (soundOn) { soundOn = false; userMuted = true; sndBtn.setAttribute('aria-pressed','false'); }
  else { userMuted = false; enableSound('button'); }
});
window.addEventListener('pointerdown', () => enableSound(true));
window.addEventListener('keydown', () => enableSound(true));
setTimeout(()=>{ if(!soundOn) hint.style.opacity = 0.0; }, 9000);

/* ---------- agulles pintades ---------- */
// traç irregular determinista perquè sembli pinzellada
function rnd(seed){ let s = seed; return () => (s = (s*16807) % 2147483647) / 2147483647; }
function brushPoly(pts, seed, amp){
  const R = rnd(seed); ctx.beginPath();
  pts.forEach((p,i)=>{ const j = (R()-.5)*amp, k = (R()-.5)*amp;
    i ? ctx.lineTo(p[0]+j, p[1]+k) : ctx.moveTo(p[0]+j, p[1]+k); });
  ctx.closePath();
}
const HOUR_PTS = [[-0.028,0.07],[-0.022,-0.30],[-0.06,-0.37],[-0.09,-0.46],[-0.045,-0.56],[0,-0.62],
                  [0.045,-0.55],[0.095,-0.46],[0.065,-0.37],[0.022,-0.30],[0.028,0.07]];
const MIN_PTS  = [[-0.05,0.09],[-0.042,-0.50],[-0.036,-0.76],[-0.07,-0.83],[-0.03,-0.94],[0.015,-0.95],
                  [0.065,-0.84],[0.034,-0.76],[0.04,-0.50],[0.048,0.09]];
// cada agulla es pinta amb diverses passades translúcides, com una pinzellada amb càrrega irregular
function paintHand(pts, seed){
  for (let i=0;i<5;i++){ brushPoly(pts, seed + i*97, 0.028); ctx.fill(); }
}
function drawHourHand(){ paintHand(HOUR_PTS, 7); }
function drawMinuteHand(){ paintHand(MIN_PTS, 11); }
function drawSecondHand(){
  ctx.beginPath(); ctx.moveTo(-0.009,0.18); ctx.lineTo(-0.006,-0.88); ctx.lineTo(0.006,-0.88); ctx.lineTo(0.009,0.18); ctx.closePath(); ctx.fill();
}
function clockTransform(ang, dx, dy){
  ctx.setTransform(CLOCK.ux, CLOCK.uy, CLOCK.vx, CLOCK.vy, CLOCK.cx + (dx||0), CLOCK.cy + (dy||0));
  ctx.rotate(ang);
}
let lastSec = -1, secKick = 0;
function drawHands(now){
  const ms = now.getMilliseconds(), s = now.getSeconds(), m = now.getMinutes(), h = now.getHours() % 12;
  if (s !== lastSec) { if (lastSec !== -1) tick(s % 2); lastSec = s; }
  // salt del segonder amb un petit rebot mecànic
  const k = Math.min(1, ms/90), bounce = ms < 260 ? Math.sin(ms/260*Math.PI*2) * Math.exp(-ms/80) * 0.06 : 0;
  const secAng = (s - 1 + k + bounce) / 60 * Math.PI*2;
  const minAng = (m + s/60) / 60 * Math.PI*2;
  const hrAng  = (h + m/60 + s/3600) / 12 * Math.PI*2;

  ctx.save();
  // ombra suau de les agulles sobre l'esfera
  if ('filter' in ctx) ctx.filter = 'blur(0.7px)';
  ctx.fillStyle = 'rgba(40,50,70,0.045)';
  clockTransform(hrAng, 4, 5);  drawHourHand();
  clockTransform(minAng, 4, 5); drawMinuteHand();
  // pintura: blau-negre amb reflex
  ctx.fillStyle = 'rgba(26,31,44,0.42)';
  clockTransform(hrAng);  drawHourHand();
  clockTransform(minAng); drawMinuteHand();
  ctx.fillStyle = 'rgba(78,96,120,0.10)';
  clockTransform(hrAng);  ctx.translate(-0.008,0); ctx.scale(0.35,0.97); drawHourHand();
  clockTransform(minAng); ctx.translate(-0.01,0);  ctx.scale(0.3,0.97);  drawMinuteHand();
  if ('filter' in ctx) ctx.filter = 'none';
  ctx.fillStyle = 'rgba(28,34,48,0.85)';
  clockTransform(secAng); drawSecondHand();
  // eix central
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = '#1a1f2b';
  ctx.beginPath(); ctx.ellipse(CLOCK.cx, CLOCK.cy, 7.5, 8.5, 0.1, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(160,170,180,0.6)';
  ctx.beginPath(); ctx.arc(CLOCK.cx-2, CLOCK.cy-2.5, 2.2, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

/* ---------- llum del quinqué ---------- */
let flickT = 0, flickV = 1, sway = 0;
function flicker(dt){
  flickT += dt;
  const target = 0.93 + 0.04*Math.sin(flickT*7.3) + 0.025*Math.sin(flickT*13.7+1.3) + (Math.random()-.5)*0.05;
  flickV += (target - flickV) * Math.min(1, dt*14);
  sway += ((Math.sin(flickT*2.1)*0.6 + Math.sin(flickT*5.9)*0.3 + (Math.random()-.5)*0.6) - sway) * Math.min(1, dt*6);
  return flickV;
}
function lerp(a,b,t){ return a+(b-a)*t; }

function drawLightMap(Dk, L){
  // il·luminació = llum ambient freda + llum càlida del quinqué (es multiplica sobre la pintura)
  const a = Dk;
  const r = Math.round(lerp(255, 30, a)), g = Math.round(lerp(255, 36, a)), b = Math.round(lerp(255, 70, a));
  lctx.globalCompositeOperation = 'source-over';
  lctx.fillStyle = `rgb(${r},${g},${b})`;
  lctx.fillRect(0,0,lm.width,lm.height);
  if (L > 0.001) {
    lctx.globalCompositeOperation = 'lighter';
    const fx = FLAME.x/LS, fy = (FLAME.y-40)/LS, R = 1250/LS;
    const gr = lctx.createRadialGradient(fx, fy, 2, fx, fy, R);
    const I = L;
    gr.addColorStop(0.00, `rgba(255,214,150,${0.98*I})`);
    gr.addColorStop(0.10, `rgba(255,196,120,${0.90*I})`);
    gr.addColorStop(0.28, `rgba(250,165,90,${0.62*I})`);
    gr.addColorStop(0.50, `rgba(220,130,70,${0.34*I})`);
    gr.addColorStop(0.75, `rgba(170,95,55,${0.14*I})`);
    gr.addColorStop(1.00, 'rgba(120,70,40,0)');
    lctx.fillStyle = gr; lctx.fillRect(0,0,lm.width,lm.height);
    // el cremador de llautó fa ombra cap avall: la taula just sota el dipòsit rep menys llum directa
    lctx.globalCompositeOperation = 'source-over';
    const sh = lctx.createRadialGradient(FLAME.x/LS, 1150/LS, 5, FLAME.x/LS, 1150/LS, 190/LS);
    sh.addColorStop(0, `rgba(${r},${g},${b},${0.35*I*a})`); sh.addColorStop(1, `rgba(${r},${g},${b},0)`);
    lctx.fillStyle = sh; lctx.fillRect(0,0,lm.width,lm.height);
  }
}

function drawFlame(L, t){
  if (L <= 0.01) return;
  const h = (40 + 52*Math.pow(L, 0.7)) * (0.94 + 0.08*flickV);
  const w = 11 + 8*L;
  const fx = FLAME.x, fy = FLAME.y, tip = sway * 5 * L;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  // halo interior del vidre
  let g = ctx.createRadialGradient(fx, fy - h*0.45, 4, fx, fy - h*0.45, 175);
  g.addColorStop(0, `rgba(255,190,110,${0.42*L*flickV})`);
  g.addColorStop(0.35, `rgba(240,140,60,${0.18*L})`);
  g.addColorStop(1, 'rgba(200,90,30,0)');
  ctx.fillStyle = g; ctx.fillRect(fx-200, fy-h*0.45-200, 400, 400);
  // flama (mig transparent: es veu a través del vidre esmerilat)
  ctx.globalAlpha = 0.85;
  if ('filter' in ctx) ctx.filter = 'blur(1.6px)';
  ctx.beginPath();
  ctx.moveTo(fx + tip, fy - h);
  ctx.bezierCurveTo(fx + w*1.2 + tip*0.4, fy - h*0.5, fx + w*1.05, fy - 4, fx, fy);
  ctx.bezierCurveTo(fx - w*1.05, fy - 4, fx - w*1.2 + tip*0.4, fy - h*0.5, fx + tip, fy - h);
  g = ctx.createRadialGradient(fx, fy - h*0.28, 1, fx, fy - h*0.40, h*0.8);
  g.addColorStop(0.00, `rgba(255,252,230,${L})`);
  g.addColorStop(0.25, `rgba(255,228,150,${0.95*L})`);
  g.addColorStop(0.55, `rgba(255,160,60,${0.80*L})`);
  g.addColorStop(1.00, 'rgba(230,80,20,0)');
  ctx.fillStyle = g; ctx.fill();
  // base blavosa
  ctx.globalAlpha = 0.5*L;
  g = ctx.createRadialGradient(fx, fy - 4, 1, fx, fy - 4, w*1.1);
  g.addColorStop(0, 'rgba(120,150,255,0.8)'); g.addColorStop(1, 'rgba(60,80,200,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(fx, fy - 5, w*1.1, 8, 0, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawEmber(e){
  if (e <= 0.01) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(FLAME.x, FLAME.y-2, 0, FLAME.x, FLAME.y-2, 12);
  g.addColorStop(0, `rgba(255,120,40,${0.9*e})`); g.addColorStop(1, 'rgba(255,60,10,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(FLAME.x, FLAME.y-2, 12, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

/* ---------- bucle ---------- */
let last = performance.now();
function frame(t){
  const dt = Math.min(0.1, (t - last)/1000); last = t;
  const target = targetDarkness();
  // l'ambient canvia a poc a poc (~9 s d'un extrem a l'altre)
  D += Math.max(-dt/9, Math.min(dt/9, target - D));
  // el quinqué s'encén quan ja comença a fosquejar i s'apaga en quant torna la claror
  const lampOn = target > 0.5 && D > 0.3;
  if (lampOn) { lamp = Math.min(1, lamp + dt/3.2); ember = 0; }
  else if (lamp > 0) { lamp = Math.max(0, lamp - dt/6); if (lamp === 0) ember = 1; }
  if (ember > 0) ember = Math.max(0, ember - dt/4);

  const f = flicker(dt);
  // encesa: primers moments amb petits espetecs
  const sput = lamp < 0.35 && lampOn ? 0.75 + 0.25*Math.random() : 1;
  const L = Math.pow(lamp, 1.3) * f * sput;
  const Dk = Math.pow(D, 1.15);

  ctx.setTransform(1,0,0,1,0,0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1; if ('filter' in ctx) ctx.filter = 'none';
  if (img.complete && img.naturalWidth) ctx.drawImage(img, 0, 0, W, H);
  else { ctx.fillStyle = '#e9a88f'; ctx.fillRect(0,0,W,H); }
  drawHands(new Date());

  if (Dk > 0.002 || L > 0.002) {
    drawLightMap(Dk, L * Math.max(Dk, 0.25));
    ctx.globalCompositeOperation = 'multiply';
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(lm, 0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
  }
  drawFlame(L, t);
  drawEmber(ember * Dk);

  // paret i marc de l'habitació
  const wallDim = Math.max(0.12, 1 - 0.86*Dk + 0.10*L*Dk);
  document.documentElement.style.setProperty('--dim', wallDim.toFixed(3));
  document.documentElement.style.setProperty('--frameLit', Math.max(0.2, 1 - 0.75*Dk + 0.22*L*Dk).toFixed(3));
  document.body.classList.toggle('night', D > 0.5);

  requestAnimationFrame(frame);
}
img.decode ? img.decode().catch(()=>{}).finally(()=>requestAnimationFrame(frame)) : (img.onload = () => requestAnimationFrame(frame));
})();
</script>
</body>
